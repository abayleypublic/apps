apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stg-activity
  namespace: argocd
spec:
  project: activity
  source:
    repoURL: https://github.com/abayleypublic/activity_tracker_api
    targetRevision: v0.4.2
    path: deploy/overlays/stg
    kustomize:
      images:
        - name: europe-west2-docker.pkg.dev/portfolio-463406/docker-repository/activity_tracker_api
          newTag: v0.4.2
  destination:
    name: portfolio
    namespace: stg-activity
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    automated:
      selfHeal: true
      prune: true
