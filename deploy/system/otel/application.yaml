apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel
  namespace: argocd
spec:
  project: system
  sources:
    - repoURL: https://github.com/abayleypublic/apps
      targetRevision: HEAD
      path: deploy/system/otel/operator-helm/chart
      helm:
        valueFiles:
          - ../values.yaml
    - repoURL: https://github.com/abayleypublic/apps
      targetRevision: HEAD
      path: deploy/system/otel/ebpf
      kustomize:
        images:
          - otel/ebpf-instrument:v0.8.0
    - repoURL: https://github.com/abayleypublic/apps
      targetRevision: HEAD
      path: deploy/system/otel/collector
      kustomize:
        images:
          - ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.151.0
  destination:
    name: portfolio
    namespace: observability
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    automated:
      selfHeal: true
      prune: true
