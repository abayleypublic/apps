apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: activity
  namespace: argocd
spec:
  description: Activity Tracker
  sourceRepos:
    - '*'
  destinations:
    - namespace: '*'
      server: '*'
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: 'kargo.akuity.io'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'