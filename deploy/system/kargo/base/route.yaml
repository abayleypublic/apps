apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kargo-route
  namespace: kargo
spec:
  parentRefs:
    - name: default-gateway
      namespace: envoy-gateway-system
  hostnames:
    - "kargo.austinbayley.co.uk"
  rules:
    - backendRefs:
        - name: kargo
          port: 80
