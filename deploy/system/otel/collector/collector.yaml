# Adapted from:
# - https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/main/examples/kubernetes/otel-collector.yaml
# - https://grafana.com/docs/opentelemetry/collector/opentelemetry-collector/#advanced-manual-setup

apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel
spec: 
  image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
  mode: daemonset
  serviceAccount: otel-collector
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      filelog:
        include:
          - /var/log/pods/*/*/*.log
        exclude:
          - /var/log/pods/*/envoy*/*.log
          - /var/log/pods/*/notification-controller/*.log
          - /var/log/pods/*/application-controller/*.log
          - /var/log/pods/*/repo-server/*.log
          - /var/log/pods/*/autoinstrument/*.log
          - /var/log/pods/*/cilium-agent/*.log
        start_at: end
        include_file_path: true
        include_file_name: false
        operators:
          # Find out which format is used by kubernetes
          - type: router
            id: get-format
            routes:
              - output: parser-docker
                expr: 'body matches "^\\{"'
              - output: parser-crio
                expr: 'body matches "^[^ Z]+ "'
              - output: parser-containerd
                expr: 'body matches "^[^ Z]+Z"'
          # Parse CRI-O format
          - type: regex_parser
            id: parser-crio
            regex: '^(?P<time>[^ Z]+) (?P<stream>stdout|stderr) (?P<logtag>[^ ]*) ?(?P<log>.*)$'
            output: extract_metadata_from_filepath
            timestamp:
              parse_from: attributes.time
              layout_type: gotime
              layout: '2006-01-02T15:04:05.999999999Z07:00'
          # Parse CRI-Containerd format
          - type: regex_parser
            id: parser-containerd
            regex: '^(?P<time>[^ ^Z]+Z) (?P<stream>stdout|stderr) (?P<logtag>[^ ]*) ?(?P<log>.*)$'
            output: extract_metadata_from_filepath
            timestamp:
              parse_from: attributes.time
              layout: '%Y-%m-%dT%H:%M:%S.%LZ'
          # Parse Docker format
          - type: json_parser
            id: parser-docker
            output: extract_metadata_from_filepath
            timestamp:
              parse_from: attributes.time
              layout: '%Y-%m-%dT%H:%M:%S.%LZ'
          # Extract metadata from file path
          - type: regex_parser
            id: extract_metadata_from_filepath
            regex: '^.*\/(?P<namespace>[^_]+)_(?P<pod_name>[^_]+)_(?P<uid>[a-f0-9\-]{36})\/(?P<container_name>[^\._]+)\/(?P<restart_count>\d+)\.log$'
            parse_from: attributes["log.file.path"]
            cache:
              size: 128  # default maximum amount of Pods per Node is 110
          # Update body field after finishing all parsing
          - type: move
            from: attributes.log
            to: body
          # Rename attributes
          - type: move
            from: attributes.stream
            to: attributes["log.iostream"]
          - type: move
            from: attributes.container_name
            to: resource["k8s.container.name"]
          - type: move
            from: attributes.namespace
            to: resource["k8s.namespace.name"]
          - type: move
            from: attributes.pod_name
            to: resource["k8s.pod.name"]
          - type: move
            from: attributes.restart_count
            to: resource["k8s.container.restart_count"]
          - type: move
            from: attributes.uid
            to: resource["k8s.pod.uid"]

    processors:
      batch:
        timeout: 200ms
        send_batch_size: 512
        send_batch_max_size: 1024
      resourcedetection:
        detectors: 
          - "env"
          - "system"
        override: false
      transform/drop_unneeded_resource_attributes:
        error_mode: ignore
        trace_statements:
          - context: resource
            statements:
              - delete_key(attributes, "k8s.pod.start_time")
              - delete_key(attributes, "os.description")
              - delete_key(attributes, "os.type")
              - delete_key(attributes, "process.command_args")
              - delete_key(attributes, "process.executable.path")
              - delete_key(attributes, "process.pid")
              - delete_key(attributes, "process.runtime.description")
              - delete_key(attributes, "process.runtime.name")
              - delete_key(attributes, "process.runtime.version")
        metric_statements:
          - context: resource
            statements:
              - delete_key(attributes, "k8s.pod.start_time")
              - delete_key(attributes, "os.description")
              - delete_key(attributes, "os.type")
              - delete_key(attributes, "process.command_args")
              - delete_key(attributes, "process.executable.path")
              - delete_key(attributes, "process.pid")
              - delete_key(attributes, "process.runtime.description")
              - delete_key(attributes, "process.runtime.name")
              - delete_key(attributes, "process.runtime.version")
        log_statements:
          - context: resource
            statements:
              - delete_key(attributes, "k8s.pod.start_time")
              - delete_key(attributes, "os.description")
              - delete_key(attributes, "os.type")
              - delete_key(attributes, "process.command_args")
              - delete_key(attributes, "process.executable.path")
              - delete_key(attributes, "process.pid")
              - delete_key(attributes, "process.runtime.description")
              - delete_key(attributes, "process.runtime.name")
              - delete_key(attributes, "process.runtime.version")
      transform/add_resource_attributes_as_metric_attributes:
        error_mode: ignore
        metric_statements:
          - context: datapoint
            statements:
              - set(attributes["deployment.environment"], resource.attributes["deployment.environment"])
              - set(attributes["service.version"], resource.attributes["service.version"])

      k8sattributes:
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.cronjob.name
            - k8s.job.name
            - k8s.node.name
            - k8s.pod.uid
            - k8s.pod.start_time
        pod_association:
          - sources:
              - from: connection

      filter/healthchecks:
        error_mode: ignore
        traces:
          span:
            - 'attributes["http.route"] != nil and IsMatch(attributes["http.route"], "^/(health(z)?|ready|live)$")'
            - 'attributes["url.path"] != nil and IsMatch(attributes["url.path"], "^/(health(z)?|ready|live)$")'
            - 'IsMatch(name, "^(GET|HEAD) /(?:healthz?|ready|live)$")'
            - 'attributes["rpc.system"] == "grpc" and attributes["rpc.service"] == "grpc.health.v1.Health" and attributes["rpc.method"] == "Check"'

      redaction:
        allow_all_keys: false
        redact_all_types: true
        allowed_keys:
          # General
          - server.address
          - server.port
          - client.port
          - source.port
          - destination.address
          - destination.port
          
          # Network
          - network.carrier.icc
          - network.carrier.mcc
          - network.carrier.mnc
          - network.carrier.name
          - network.connection.subtype
          - network.connection.type
          - network.local.port
          - network.peer.port
          - network.protocol.name
          - network.protocol.version
          - network.transport
          - network.type
          
          # Service & Deployment
          - service.name
          - service.namespace
          - service.version
          - service.instance.id
          - service.peer.name
          - service.peer.namespace
          - deployment.environment
          
          # Thread & Code
          - thread.id
          - thread.name
          - code.column
          - code.filepath
          - code.function
          - code.lineno
          - code.namespace
          
          # HTTP & URL
          - http.request.body.size
          - http.request.method
          - http.request.method_original
          - http.request.resend_count
          - http.request.size
          - http.response.body.size
          - http.response.size
          - http.response.status_code
          - http.route
          - url.full
          - url.path
          - url.query
          - url.scheme
          - url.template
          
          # User Agent
          - user_agent.original
          - user_agent.synthetic.type
          
          # Database
          - db.collection.name
          - db.namespace
          - db.operation.batch.size
          - db.operation.name
          - db.query.summary
          - db.response.returned_rows
          - db.response.status_code
          - db.stored_procedure.name
          - db.system.name
          
          # Errors & Exceptions
          - exception.type
          - error.type
          
          # Cloud & Messaging
          - cloud.resource_id
          - messaging.batch.message_count
          - messaging.consumer.group.name
          - messaging.destination.anonymous
          - messaging.destination.name
          - messaging.destination.partition.id
          - messaging.destination.subscription.name
          - messaging.destination.template
          - messaging.destination.temporary
          - messaging.message.body.size
          - messaging.message.envelope.size
          - messaging.operation.name
          - messaging.operation.type
          - messaging.system
          
          # FaaS
          - faas.coldstart
          - faas.cron
          - faas.document.collection
          - faas.document.name
          - faas.document.operation
          - faas.document.time
          - faas.invocation_id
          - faas.invoked_name
          - faas.invoked_provider
          - faas.invoked_region
          - faas.time
          - faas.trigger
          
          # RPC
          - rpc.method
          - rpc.method_original
          - rpc.response.status_code
          - rpc.system.name
          
          # CloudEvents
          - cloudevents.event_id
          - cloudevents.event_source
          - cloudevents.event_spec_version
          - cloudevents.event_subject
          - cloudevents.event_type
          
          # Telemetry SDK
          - telemetry.sdk.language
          - telemetry.sdk.name
          - telemetry.sdk.version
          
          # Legacy
          - opentracing.ref_type
        
        blocked_key_patterns:
          - ".*token.*"
          - ".*api_key.*"
          - ".*apikey.*"
          - ".*password.*"
          - ".*passwd.*"
          - ".*secret.*"
          - ".*credential.*"
          - ".*access.?key.*"
          - ".*private.?key.*"
          - ".*public.?key.*"
          - ".*auth.*"
          - ".*bearer.*"
          - ".*jwt.*"
          - ".*session.*"
          - ".*cookie.*"
          - ".*aws.?secret.*"
          - ".*azure.?key.*"
          - ".*gcp.?key.*"
          - ".*client.?secret.*"
          - ".*certificate.*"
          - ".*cert.*"
          - ".*x-api-key.*"
          - ".*x-auth.*"
          - ".*oauth.*"
          - ".*refresh.*"
          - ".*authorization.?code.*"
          - ".*nonce.*"
          - ".*client.?id.*"
          - ".*redirect.?uri.*"
          - ".*pkce.*"
          - ".*verifier.*"
          - ".*challenge.*"
          - ".*user.?id.*"
          - ".*account.?id.*"
          - ".*customer.?id.*"
        hash_function: md5
        summary: debug
        url_sanitizer:
          enabled: true
          attributes: ["http.url", "url", "url.full"]
          sanitize_span_name: true
        db_sanitizer:
          sanitize_span_name: true
          sql:
            enabled: true
            attributes: ["db.statement", "db.query"]
          redis:
            enabled: true
            attributes: ["db.statement", "redis.command"]
          memcached:
            enabled: true
            attributes: ["db.statement", "memcached.command"] 
          mongo:
            enabled: true
            attributes: ["db.statement", "mongodb.query"]
          opensearch:
            enabled: true
            attributes: ["db.statement", "opensearch.body"]
          es:
            enabled: true
            attributes: ["db.statement", "elasticsearch.body"]

    exporters:
      otlphttp/grafana_cloud:
        endpoint: "https://otlp-gateway-prod-gb-south-1.grafana.net/otlp"
        auth:
          authenticator: basicauth/grafana_cloud

    extensions:
      basicauth/grafana_cloud:
        client_auth:
          username: "1374854"
          password: "${env:GRAFANA_CLOUD_API_KEY}"
      health_check:
        endpoint: 0.0.0.0:13133

    connectors:
      grafanacloud:
        host_identifiers: 
          - "k8s.node.name"

    service:
      extensions:
        - basicauth/grafana_cloud
        - health_check
      pipelines:
        traces:
          receivers: 
            - otlp
          processors:
            - resourcedetection
            - k8sattributes
            - redaction
            - transform/drop_unneeded_resource_attributes
            - filter/healthchecks
            - batch
          exporters: 
            - otlphttp/grafana_cloud
        metrics:
          receivers: 
            - otlp
          processors:
            - resourcedetection
            - k8sattributes
            - transform/drop_unneeded_resource_attributes
            - redaction
            - transform/add_resource_attributes_as_metric_attributes
            - batch
          exporters: 
            - otlphttp/grafana_cloud
        logs:
          receivers: 
            - otlp
            - filelog
          processors:
            - resourcedetection
            - k8sattributes
            - redaction
            - transform/drop_unneeded_resource_attributes
            - batch
          exporters: 
            - otlphttp/grafana_cloud

  env:
    - name: GRAFANA_CLOUD_API_KEY
      valueFrom:
        secretKeyRef:
          name: grafana-cloud-credentials
          key: API_KEY
  
  resources:
    limits:
      cpu: 250m
      memory: 512Mi

  volumeMounts:
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true
  volumes:
    - name: varlogpods
      hostPath:
        path: /var/log/pods